<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
      background: #1a1a2e;
      color: #fff;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 16px;
      color: #ff0050;
    }
    .info {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }
    textarea {
      width: 100%;
      height: 80px;
      padding: 10px;
      border: 1px solid #333;
      border-radius: 8px;
      background: #16213e;
      color: #fff;
      font-size: 14px;
      resize: none;
      margin-bottom: 12px;
    }
    textarea::placeholder {
      color: #666;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-send {
      background: #ff0050;
      color: #fff;
      margin-bottom: 8px;
    }
    .btn-send:hover {
      background: #ff3377;
    }
    .btn-send:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .btn-test {
      background: #333;
      color: #aaa;
    }
    .btn-test:hover {
      background: #444;
    }
    .status {
      margin-top: 12px;
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      display: none;
    }
    .status.success {
      background: #0d3320;
      color: #00ff88;
      display: block;
    }
    .status.error {
      background: #331111;
      color: #ff4444;
      display: block;
    }
    .status.info {
      background: #112233;
      color: #4488ff;
      display: block;
    }
    .step {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>📩 TikTok 私信助手</h1>
  <p class="info">在达人主页打开此插件，输入私信内容并发送</p>
  
  <textarea id="message" placeholder="输入要发送的私信内容..."></textarea>
  
  <button class="btn-send" id="sendBtn">发送私信</button>
  <button class="btn-test" id="testBtn">测试连接</button>
  
  <div class="status" id="status"></div>
  <div class="step" id="step"></div>

  <script src="popup.js"></script>
</body>
</html>
